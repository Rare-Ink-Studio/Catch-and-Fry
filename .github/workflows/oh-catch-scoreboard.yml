name: Publish Catch and Fry harbor scoreboard
on:
  push:
    paths:
      - .github/workflows/oh-catch-scoreboard.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full game-only leaderboard update
        run: |
          python3 - <<'PY'
          import base64,lzma,subprocess
          compressed=''''''
          patch=lzma.decompress(base64.b64decode(compressed)).decode()
          subprocess.run(['git','apply','--check','-'],input=patch,text=True,check=True)
          subprocess.run(['git','apply','-'],input=patch,text=True,check=True)
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'fishPodium' in s and 'CATCH & FRY' in s
          Path('/tmp/catch-check.js').write_text(s.split('<script>')[-1].split('</script>')[0])
          PY
          node --check /tmp/catch-check.js
      - name: Commit complete game file
        run: |
          git config user.name 'Rare Ink Studio game updates'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/oh-catch-scoreboard.yml
          git add index.html
          git commit -m 'Catch and Fry: harbor-themed Passport leaderboard'
          git push
      - name: Package full playable game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/Catch-and-Fry-FULL.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and '.github' not in p.parts:
                z.write(p,p.as_posix())
          PY
          mkdir -p /tmp/catch-handoff
          cp index.html /tmp/catch-handoff/index.html
          cp /tmp/Catch-and-Fry-FULL.zip /tmp/catch-handoff/Catch-and-Fry-FULL.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Catch-and-Fry-complete-harbor-scoreboard
          path: /tmp/catch-handoff/
          retention-days: 14