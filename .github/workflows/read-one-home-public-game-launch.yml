name: Read-only One Home game launch diagnostic
on:
  push:
    paths:
      - .github/workflows/read-one-home-public-game-launch.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect currently published public front end without credentials
        shell: bash
        run: |
          mkdir -p /tmp/onehome-public-assets
          curl -fsSL --retry 2 https://doodlabs.app/ -o /tmp/onehome-public-assets/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          import urllib.request
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):super().__init__();self.sources=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      src=dict(attrs).get('src')
                      if src:self.sources.append(src)
          root=Path('/tmp/onehome-public-assets'); parser=Scripts();parser.feed((root/'index.html').read_text())
          print('Public script sources:',parser.sources)
          for idx,src in enumerate(parser.sources):
              url=urljoin('https://doodlabs.app/',src)
              if urlparse(url).netloc!='doodlabs.app':continue
              try:
                  data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read()
                  if len(data)>5_000_000:continue
                  (root/f'script-{idx}.js').write_bytes(data)
                  text=data.decode('utf-8','replace')
                  for term in ('OH_GAME_LAUNCH','OH_GAME_READY','onehome-game-launch','catch_and_fry','rollies_speakeasy'):
                      print(f'{idx} {term}: {text.count(term)}')
                  for term in ('OH_GAME_READY','onehome-game-launch','catch_and_fry'):
                      pos=0
                      for _ in range(6):
                          pos=text.find(term,pos)
                          if pos<0:break
                          print(f'CONTEXT {idx} {term} offset={pos}: {text[max(0,pos-250):pos+350]}')
                          pos+=len(term)
              except Exception as e:print('Fetch failed',url,type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: One-Home-public-launch-diagnostic
          path: /tmp/onehome-public-assets/
          retention-days: 1
