name: Catch and Fry KISS cleanup
on:
  push:
    paths:
      - .github/workflows/catch-fry-kiss-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove redundant Passport UI without changing game scoring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          source=p.read_text(encoding='utf-8')
          text=source
          def replace_exact(old,new):
              global text
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'Expected exactly one occurrence ({n}): {old[:95]!r}')
              text=text.replace(old,new,1)
          replace_exact('<button id="passportBtnSmall">PASSPORT</button>\n','')
          replace_exact('bind("passportBtnSmall",showPassportStatus);\n','')
          replace_exact('document.getElementById("passportBtnSmall").textContent="PASSPORT ✓";\n','')
          replace_exact('document.getElementById("passportBtnSmall").textContent="PASSPORT";\n','')
          replace_exact('const openOneHomeLink=document.getElementById("openOneHomeLink");\n','')
          replace_exact('openOneHomeLink.hidden=true;\n','')
          replace_exact('openOneHomeLink.hidden=false;\n','')
          replace_exact('const profileStatus=document.getElementById("profileStatus");\n','')
          replace_exact('profileStatus.textContent=message;\n','')
          replace_exact('<div id="profileStatus">Waiting for your One Home Passport...</div>\n','')
          replace_exact('<br>\n<a class="linkBtn" id="openOneHomeLink" href="https://doodlabs.app" target="_blank" rel="noopener">Open One Home to link your Passport</a>\n','')
          replace_exact('#start #profileStatus, #start #openOneHomeLink { display: none !important; }\n','')
          replace_exact('say("One Home Passport linked. Leaderboard saving is ready.");\n','')
          replace_exact('say("Sizzle! Sold basket for $"+earned+"! Open through One Home to save scores.");','say("Sizzle! Sold basket for $"+earned+"! Score not saved.");')
          replace_exact('say("Open Catch & Fry through One Home to link your Passport and submit.");','say("Score not saved.");')
          m=re.search(r'function showPassportStatus\(\)\{\n.*?\n\}\n\n(?=function currentScore\(\))',text,re.S)
          if not m:
              raise SystemExit('Could not isolate unused showPassportStatus function')
          text=text[:m.start()]+text[m.end():]
          if text==source: raise SystemExit('No changes made')
          p.write_text(text,encoding='utf-8')
          print('Removed redundant game Passport button, links, and prompts; preserved score submission.')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          content=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',content,re.S)
          assert len(scripts)==1, 'Unexpected inline game script count'
          assert 'async function submitScore' in scripts[0]
          assert 'OH_GAME_LAUNCH' in scripts[0]
          assert 'passportBtnSmall' not in content
          assert 'openOneHomeLink' not in content
          assert 'Open through One Home to save scores' not in content
          Path('/tmp/catch-fry-check.js').write_text(scripts[0])
          PY
          node --check /tmp/catch-fry-check.js
          git diff --check
          git config user.name 'Catch and Fry cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove redundant Passport prompts from Catch and Fry game UI'
          git push