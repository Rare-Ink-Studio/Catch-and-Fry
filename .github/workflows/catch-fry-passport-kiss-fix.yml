name: Catch and Fry Passport and KISS fix
on:
  push:
    paths:
      - .github/workflows/catch-fry-passport-kiss-fix.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update full game source and verify scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          original=p.read_text(encoding='utf-8')
          s=original
          def swap(old,new,count=1):
              global s
              actual=s.count(old)
              assert actual==count, f'Expected {count} copies, found {actual}: {old[:90]!r}'
              s=s.replace(old,new)
          swap('<h2>UNIVERSAL LEADERBOARD 🏆</h2>','<h2>CATCH & FRY LEADERBOARD 🏆</h2>')
          swap('<p class="small">Scores use your One Home Passport and are shown as UNVERIFIED.</p>\n','')
          swap('<div id="leaderProfileStatus">Waiting for your One Home Passport...</div>\n','')
          swap('const leaderProfileStatus=document.getElementById("leaderProfileStatus");\n','')
          swap('function setStatus(message){\nleaderProfileStatus.textContent=message;\n}\n\n','')
          swap('if(!passportLaunch)return "Guest";','if(!passportLaunch)return "—";',2)
          old='''function updatePassportUi(){
          if(passportLaunch){
          hudProfileEl.textContent=profileName();
          setStatus("Passport linked automatically: "+profileDisplay()+". Scores save as UNVERIFIED.");
          submitScoreBtn.disabled=false;
          }else{
          hudProfileEl.textContent="Guest";
          setStatus("Guest play is available. Open Catch & Fry through One Home to link your Passport and save scores.");
          submitScoreBtn.disabled=true;
          }
          }
          '''
          new='''function updatePassportUi(){
          const linked=validLaunch(passportLaunch);
          hudProfileEl.textContent=linked ? profileName() : "—";
          submitScoreBtn.disabled=!linked;
          }
          '''
          swap(old,new)
          swap('function postReady(origin){','function requestPassportLaunch(){\ntry{postReady(new URL(document.referrer).origin);}catch(_error){}\n}\n\nfunction postReady(origin){')
          swap('updatePassportUi();\n});\n\nfunction currentScore()', 'updatePassportUi();\nif(started && score>lastSubmittedScore)void submitScore(false);\n});\n\nfunction currentScore()')
          swap('function startGame(){\naudioStart();','function startGame(){\nif(!validLaunch(passportLaunch)){\nrequestPassportLaunch();\nsay("Passport connection unavailable.");\nreturn;\n}\naudioStart();')
          swap('if(passportLaunch){\nsay("Sizzle! Sold basket for $"+earned+"! Saving score...");','if(validLaunch(passportLaunch)){\nsay("Sizzle! Sold basket for $"+earned+"! Saving score...");')
          swap('say("Sizzle! Sold basket for $"+earned+"! Score not saved.");','say("Score not saved.");\nrequestPassportLaunch();')
          swap('say("Score not saved.");\n}\nreturn;\n}\n\nif(score===lastSubmittedScore)', 'say("Score not saved.");\n}\nrequestPassportLaunch();\nreturn;\n}\n\nif(score===lastSubmittedScore)')
          swap('say("Score saved to your Passport as UNVERIFIED.");','say("Score saved.");')
          swap('const verification=safeText(String(row.verification_status || "unverified").toUpperCase());\n','')
          swap('@${username} • ${verification}','@${username}')
          swap('try{postReady(new URL(document.referrer).origin);}catch(_error){}\nresetFish();','requestPassportLaunch();\nresetFish();')
          for forbidden in ('Guest play is available','Open Catch & Fry through One Home','UNIVERSAL LEADERBOARD','Scores use your One Home Passport','@${username} • ${verification}'):
              assert forbidden not in s, forbidden
          for required in ('CATCH & FRY LEADERBOARD','onehome-game-result','OH_GAME_READY','OH_GAME_LAUNCH','validLaunch(passportLaunch)','onehome_game_public_leaderboard'):
              assert required in s,required
          assert 'function startGame(){\nif(!validLaunch(passportLaunch))' in s
          assert s.count('<button id="startBtn">START GAME</button>')==1
          assert s.count('function submitScore(')==1
          p.write_text(s,encoding='utf-8')
          print('CHECKS PASSED: game-specific title, no guest/verification clutter, start requires secure launch, score endpoint and origin handshake retained')
          print(f'SOURCE BYTES: {len(s.encode("utf-8"))}; baseline: {len(original.encode("utf-8"))}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/catch-fry-game.js').write_text(js)
          PY
          node --check /tmp/catch-fry-game.js
      - name: Commit complete updated index
        shell: bash
        run: |
          git config user.name 'Rare Ink Studio'
          git config user.email 'allunder12008@gmail.com'
          git add index.html
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No source change'; exit 1; } || true
          git commit -m 'Catch and Fry: game-specific leaderboard and authenticated-only play'
          git push origin HEAD:main
      - name: Package entire playable game and complete HTML
        shell: bash
        run: |
          mkdir -p /tmp/catch-fry-package/Catch-and-Fry
          git ls-files -z | python3 -c 'import os,sys,shutil; from pathlib import Path; files=[p for p in sys.stdin.buffer.read().split(b"\0") if p and not p.startswith(b".github/")]; root=Path("/tmp/catch-fry-package/Catch-and-Fry"); [(root/Path(os.fsdecode(p))).parent.mkdir(parents=True,exist_ok=True) for p in files]; [shutil.copy2(os.fsdecode(p),root/Path(os.fsdecode(p))) for p in files]'
          cp index.html /tmp/catch-fry-package/index.html
          cd /tmp/catch-fry-package
          zip -qr "$GITHUB_WORKSPACE/Catch-and-Fry-FULL.zip" Catch-and-Fry
      - name: Provide complete file and all assets
        uses: actions/upload-artifact@v4
        with:
          name: Catch-and-Fry-full-file-and-game
          path: |
            index.html
            Catch-and-Fry-FULL.zip
          if-no-files-found: error
          retention-days: 14
